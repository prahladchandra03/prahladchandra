<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO -->
    <title>Prahlad Chandra | Full-Stack & Node.js Developer</title>
    <meta name="description" content="Full-Stack and Node.js Developer specializing in scalable backend systems, microservices, React, Redis, databases and AWS." />
    <meta name="author" content="Prahlad Chandra" />
    <meta name="keywords" content="Prahlad Chandra, Full-Stack Developer, Node.js Developer, Backend Developer, React, TypeScript, Microservices, AWS, Portfolio" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Prahlad Chandra | Full-Stack & Node.js Developer" />
    <meta property="og:description" content="Full-Stack and Node.js Developer specializing in scalable backend systems, microservices, React, Redis, databases and AWS." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Prahlad Chandra Portfolio" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Prahlad Chandra | Full-Stack & Node.js Developer" />
    <meta name="twitter:description" content="Full-Stack and Node.js Developer specializing in scalable backend systems, microservices, React, Redis, databases and AWS." />
    
    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Google Translate Element (controlled via custom UI) -->
    <div id="google_translate_element" style="display: none; visibility: hidden; position: absolute; left: -9999px;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'en,hi,bn,es,fr,de,ja,ar,ru,zh-CN,pt',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
